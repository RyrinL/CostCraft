<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" font-family="Arial, sans-serif" font-size="11">
  <rect width="1060" height="720" fill="#ffffff"/>
  <text x="530" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2E2520">CostCraft: Entity-Relationship Diagram (13 tables)</text>

  <!-- ===== relationship lines (orthogonal, routed in the gaps) ===== -->
  <g stroke="#BCAF9B" stroke-width="1.1" fill="none">
    <path d="M147,330 L147,257"/>                                  <!-- material.category_id -> material_category -->
    <path d="M300,255 L277,255 L277,382 L255,382"/>               <!-- bom_item.material_id -> material -->
    <path d="M407,285 L407,355"/>                                 <!-- bom_item.product_id -> product -->
    <path d="M560,140 L537,140 L537,407 L515,407"/>               <!-- production_batch.product_id -> product -->
    <path d="M650,95 L650,52 L150,52 L150,70"/>                   <!-- production_batch.worker_id -> user -->
    <path d="M650,255 L650,185"/>                                 <!-- batch_item.batch_id -> production_batch -->
    <path d="M560,300 L537,300 L537,322 L270,322 L270,410 L255,410"/>  <!-- batch_item.material_id -> material -->
    <path d="M560,470 L530,470 L530,500 L262,500 L262,420 L255,420"/>  <!-- inventory_log.material_id -> material -->
    <path d="M560,440 L520,440 L520,575 L22,575 L22,140 L40,140"/>     <!-- inventory_log.user_id -> user -->
    <path d="M560,632 L505,632 L505,560 L248,560 L248,432 L255,432"/>  <!-- alert.material_id -> material -->
    <path d="M935,95 L935,40 L180,40 L180,70"/>                   <!-- sales_order.user_id -> user -->
    <path d="M935,355 L935,185"/>                                 <!-- sales_order_item.order_id -> sales_order -->
    <path d="M840,407 L515,407"/>                                 <!-- sales_order_item.product_id -> product -->
  </g>
  <!-- small dots at the foreign-key (child) ends -->
  <g fill="#BCAF9B">
    <circle cx="147" cy="330" r="2.5"/><circle cx="300" cy="255" r="2.5"/><circle cx="407" cy="285" r="2.5"/>
    <circle cx="560" cy="140" r="2.5"/><circle cx="650" cy="95" r="2.5"/><circle cx="650" cy="255" r="2.5"/>
    <circle cx="560" cy="300" r="2.5"/><circle cx="560" cy="470" r="2.5"/><circle cx="560" cy="440" r="2.5"/>
    <circle cx="560" cy="632" r="2.5"/><circle cx="935" cy="95" r="2.5"/><circle cx="935" cy="355" r="2.5"/><circle cx="840" cy="407" r="2.5"/>
  </g>

  <!-- ===== tables ===== -->
  <!-- USER -->
  <rect x="40" y="70" width="215" height="92" rx="6" fill="#FFFFFF" stroke="#C8965A" stroke-width="1.5"/>
  <rect x="40" y="70" width="215" height="24" rx="6" fill="#C8965A"/>
  <text x="50" y="87" fill="#fff" font-weight="bold">user</text>
  <text x="50" y="110">id (PK), username, password_hash,</text>
  <text x="50" y="126">salt, role, email, display_currency,</text>
  <text x="50" y="142">language, active, created_at</text>

  <!-- MATERIAL_CATEGORY -->
  <rect x="40" y="205" width="215" height="52" rx="6" fill="#FFFFFF" stroke="#C8965A" stroke-width="1.5"/>
  <rect x="40" y="205" width="215" height="24" rx="6" fill="#C8965A"/>
  <text x="50" y="222" fill="#fff" font-weight="bold">material_category</text>
  <text x="50" y="247">id (PK), name, display_order</text>

  <!-- MATERIAL (hub) -->
  <rect x="40" y="330" width="215" height="104" rx="6" fill="#FFFFFF" stroke="#A87A45" stroke-width="2"/>
  <rect x="40" y="330" width="215" height="24" rx="6" fill="#A87A45"/>
  <text x="50" y="347" fill="#fff" font-weight="bold">material</text>
  <text x="50" y="370">id (PK), category_id (FK), name,</text>
  <text x="50" y="386">package_size, package_price,</text>
  <text x="50" y="402">unit_cost, unit, current_stock,</text>
  <text x="50" y="418">low_stock_threshold, created_at</text>

  <!-- CURRENCY_RATE -->
  <rect x="40" y="615" width="215" height="68" rx="6" fill="#FFFFFF" stroke="#9C8E84" stroke-width="1.5"/>
  <rect x="40" y="615" width="215" height="24" rx="6" fill="#9C8E84"/>
  <text x="50" y="632" fill="#fff" font-weight="bold">currency_rate</text>
  <text x="50" y="656">code (PK), name, rate_to_base,</text>
  <text x="50" y="672">decimal_places, symbol</text>

  <!-- OVERHEAD_CONFIG -->
  <rect x="300" y="70" width="215" height="92" rx="6" fill="#FFFFFF" stroke="#9C8E84" stroke-width="1.5"/>
  <rect x="300" y="70" width="215" height="24" rx="6" fill="#9C8E84"/>
  <text x="310" y="87" fill="#fff" font-weight="bold">overhead_config</text>
  <text x="310" y="110">id (PK), name, cost_stage,</text>
  <text x="310" y="126">allocation_rule, fixed_amount,</text>
  <text x="310" y="142">daily_amount, percentage, active</text>

  <!-- BOM_ITEM -->
  <rect x="300" y="225" width="215" height="60" rx="6" fill="#FFFFFF" stroke="#C8965A" stroke-width="1.5"/>
  <rect x="300" y="225" width="215" height="24" rx="6" fill="#C8965A"/>
  <text x="310" y="242" fill="#fff" font-weight="bold">bom_item</text>
  <text x="310" y="266">id (PK), product_id (FK),</text>
  <text x="310" y="280">material_id (FK), gram_quantity</text>

  <!-- PRODUCT (hub) -->
  <rect x="300" y="355" width="215" height="104" rx="6" fill="#FFFFFF" stroke="#A87A45" stroke-width="2"/>
  <rect x="300" y="355" width="215" height="24" rx="6" fill="#A87A45"/>
  <text x="310" y="372" fill="#fff" font-weight="bold">product</text>
  <text x="310" y="395">id (PK), name, yield_per_batch,</text>
  <text x="310" y="411">days_per_batch, margin_lower/upper,</text>
  <text x="310" y="427">cached_unit_cost, cached_price_*,</text>
  <text x="310" y="443">active, created_at</text>

  <!-- PRODUCTION_BATCH -->
  <rect x="560" y="95" width="235" height="90" rx="6" fill="#FFFFFF" stroke="#C8965A" stroke-width="1.5"/>
  <rect x="560" y="95" width="235" height="24" rx="6" fill="#C8965A"/>
  <text x="570" y="112" fill="#fff" font-weight="bold">production_batch</text>
  <text x="570" y="135">id (PK), product_id (FK),</text>
  <text x="570" y="151">multiplier, units_produced,</text>
  <text x="570" y="167">recorded_unit/total_cost, worker_id (FK)</text>

  <!-- BATCH_ITEM -->
  <rect x="560" y="255" width="235" height="90" rx="6" fill="#FFFFFF" stroke="#C8965A" stroke-width="1.5"/>
  <rect x="560" y="255" width="235" height="24" rx="6" fill="#C8965A"/>
  <text x="570" y="272" fill="#fff" font-weight="bold">batch_item</text>
  <text x="570" y="295">id (PK), batch_id (FK),</text>
  <text x="570" y="311">material_id (FK), gram_quantity,</text>
  <text x="570" y="327">unit_cost_snapshot, line_cost</text>

  <!-- INVENTORY_LOG -->
  <rect x="560" y="430" width="235" height="90" rx="6" fill="#FFFFFF" stroke="#C8965A" stroke-width="1.5"/>
  <rect x="560" y="430" width="235" height="24" rx="6" fill="#C8965A"/>
  <text x="570" y="447" fill="#fff" font-weight="bold">inventory_log</text>
  <text x="570" y="470">id (PK), material_id (FK), user_id (FK),</text>
  <text x="570" y="486">change_quantity, reason,</text>
  <text x="570" y="502">reference_type, reference_id, note</text>

  <!-- ALERT -->
  <rect x="560" y="600" width="235" height="72" rx="6" fill="#FFFFFF" stroke="#C8965A" stroke-width="1.5"/>
  <rect x="560" y="600" width="235" height="24" rx="6" fill="#C8965A"/>
  <text x="570" y="617" fill="#fff" font-weight="bold">alert</text>
  <text x="570" y="640">id (PK), material_id (FK), alert_type,</text>
  <text x="570" y="656">message, resolved, resolved_at</text>

  <!-- SALES_ORDER -->
  <rect x="840" y="95" width="190" height="90" rx="6" fill="#FFFFFF" stroke="#7A9B7A" stroke-width="1.7"/>
  <rect x="840" y="95" width="190" height="24" rx="6" fill="#7A9B7A"/>
  <text x="850" y="112" fill="#fff" font-weight="bold">sales_order</text>
  <text x="850" y="135">id (PK), customer_name,</text>
  <text x="850" y="151">order_date, note, user_id (FK),</text>
  <text x="850" y="167">recorded_revenue, recorded_cost</text>

  <!-- SALES_ORDER_ITEM -->
  <rect x="840" y="355" width="190" height="104" rx="6" fill="#FFFFFF" stroke="#7A9B7A" stroke-width="1.7"/>
  <rect x="840" y="355" width="190" height="24" rx="6" fill="#7A9B7A"/>
  <text x="850" y="372" fill="#fff" font-weight="bold">sales_order_item</text>
  <text x="850" y="395">id (PK), order_id (FK),</text>
  <text x="850" y="411">product_id (FK), quantity,</text>
  <text x="850" y="427">unit_price, unit_cost_snapshot,</text>
  <text x="850" y="443">line_revenue, line_cost</text>

  <text x="530" y="705" text-anchor="middle" font-size="11" fill="#9C8E84">Lines = foreign keys (dot at the child end) · Green = Sales module · currency_rate &amp; overhead_config are referenced by application logic</text>
</svg>
