<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="Arial, sans-serif">
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2E2520">Sequence: Log Production Batch (single JDBC transaction)</text>

  <!-- Lifelines -->
  <g font-size="12" font-weight="bold" fill="#2E2520" text-anchor="middle">
    <g>
      <rect x="40" y="48" width="110" height="34" rx="6" fill="#F5EFE6" stroke="#C8965A"/><text x="95" y="69">Worker (JSP)</text>
      <line x1="95" y1="82" x2="95" y2="520" stroke="#DCCFBC" stroke-dasharray="4 3"/>
    </g>
    <g>
      <rect x="180" y="48" width="110" height="34" rx="6" fill="#F5EFE6" stroke="#C8965A"/><text x="235" y="69">BatchServlet</text>
      <line x1="235" y1="82" x2="235" y2="520" stroke="#DCCFBC" stroke-dasharray="4 3"/>
    </g>
    <g>
      <rect x="320" y="48" width="120" height="34" rx="6" fill="#F5EFE6" stroke="#C8965A"/><text x="380" y="69">BatchService</text>
      <line x1="380" y1="82" x2="380" y2="520" stroke="#DCCFBC" stroke-dasharray="4 3"/>
    </g>
    <g>
      <rect x="470" y="48" width="150" height="34" rx="6" fill="#F5EFE6" stroke="#C8965A"/><text x="545" y="69">DAOs (Batch, Item,</text>
      <line x1="545" y1="82" x2="545" y2="520" stroke="#DCCFBC" stroke-dasharray="4 3"/>
    </g>
    <g>
      <rect x="690" y="48" width="120" height="34" rx="6" fill="#DCCFBC" stroke="#A87A45"/><text x="750" y="69">MySQL</text>
      <line x1="750" y1="82" x2="750" y2="520" stroke="#DCCFBC" stroke-dasharray="4 3"/>
    </g>
  </g>
  <text x="545" y="98" text-anchor="middle" font-size="10" fill="#6B5D52">Material, InventoryLog, Alert)</text>

  <!-- Messages -->
  <g font-size="11" fill="#2E2520">
    <line x1="95" y1="120" x2="233" y2="120" stroke="#A87A45" stroke-width="1.5" marker-end="url(#s)"/>
    <text x="100" y="114">POST /batches (productId, multiplier)</text>

    <line x1="237" y1="150" x2="378" y2="150" stroke="#A87A45" stroke-width="1.5" marker-end="url(#s)"/>
    <text x="242" y="144">recordBatch(...)</text>

    <line x1="380" y1="178" x2="380" y2="178" stroke="#A87A45"/>
    <rect x="372" y="172" width="16" height="320" fill="#F5EFE6" stroke="#C8965A"/>
    <text x="396" y="190" font-size="10" fill="#7A9B7A" font-weight="bold">conn.setAutoCommit(false)</text>

    <line x1="388" y1="212" x2="543" y2="212" stroke="#A87A45" stroke-width="1.5" marker-end="url(#s)"/>
    <text x="392" y="206">compute HPP · insertBatch()</text>

    <line x1="545" y1="240" x2="748" y2="240" stroke="#A87A45" stroke-width="1.5" marker-end="url(#s)"/>
    <text x="550" y="234">INSERT production_batch</text>

    <text x="392" y="270" font-size="10" font-weight="bold" fill="#6B5D52">loop  [for each BOM item]</text>
    <rect x="386" y="278" width="380" height="120" fill="none" stroke="#9C8E84" stroke-dasharray="3 2"/>
    <line x1="388" y1="300" x2="543" y2="300" stroke="#A87A45" stroke-width="1.5" marker-end="url(#s)"/>
    <text x="392" y="294">insert batch_item · deductStock()</text>
    <line x1="545" y1="324" x2="748" y2="324" stroke="#A87A45" stroke-width="1.5" marker-end="url(#s)"/>
    <text x="550" y="318">UPDATE material · INSERT inventory_log</text>
    <line x1="388" y1="354" x2="543" y2="354" stroke="#A87A45" stroke-width="1.5" marker-end="url(#s)"/>
    <text x="392" y="348">if below threshold → alertDao.create()</text>
    <line x1="545" y1="378" x2="748" y2="378" stroke="#A87A45" stroke-width="1.5" marker-end="url(#s)"/>
    <text x="550" y="372">INSERT alert</text>

    <line x1="388" y1="424" x2="748" y2="424" stroke="#7A9B7A" stroke-width="1.8" marker-end="url(#s)"/>
    <text x="392" y="418" font-weight="bold" fill="#5E7E5E">conn.commit()  (rollback() on any exception)</text>

    <line x1="378" y1="460" x2="237" y2="460" stroke="#A87A45" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#s)"/>
    <text x="250" y="454">batchId</text>
    <line x1="233" y1="490" x2="97" y2="490" stroke="#A87A45" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#s)"/>
    <text x="110" y="484">redirect → confirmation + alerts</text>
  </g>

  <defs>
    <marker id="s" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#A87A45"/>
    </marker>
  </defs>
</svg>
