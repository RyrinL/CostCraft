<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 690" font-family="Arial, sans-serif">
  <rect width="1010" height="690" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2E2520">CostCraft: Use-Case Diagram</text>

  <!-- system boundary (wider to fit Login on the right) -->
  <rect x="250" y="52" width="660" height="592" rx="10" fill="none" stroke="#DCCFBC" stroke-width="2"/>
  <text x="580" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#9C8E84">CostCraft System</text>

  <!-- Owner actor -->
  <g stroke="#2E2520" stroke-width="2" fill="none">
    <circle cx="90" cy="190" r="16"/>
    <line x1="90" y1="206" x2="90" y2="245"/><line x1="65" y1="220" x2="115" y2="220"/>
    <line x1="90" y1="245" x2="68" y2="275"/><line x1="90" y1="245" x2="112" y2="275"/>
  </g>
  <text x="90" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E2520">Owner</text>

  <!-- Worker actor -->
  <g stroke="#2E2520" stroke-width="2" fill="none">
    <circle cx="90" cy="470" r="16"/>
    <line x1="90" y1="486" x2="90" y2="525"/><line x1="65" y1="500" x2="115" y2="500"/>
    <line x1="90" y1="525" x2="68" y2="555"/><line x1="90" y1="525" x2="112" y2="555"/>
  </g>
  <text x="90" y="578" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E2520">Worker</text>

  <!-- include lines: every use case -> Login (dashed) -->
  <g stroke="#B0A18F" stroke-width="1" stroke-dasharray="5 3" fill="none">
    <line x1="580" y1="118" x2="770" y2="310"/>
    <line x1="580" y1="166" x2="770" y2="320"/>
    <line x1="580" y1="214" x2="770" y2="330"/>
    <line x1="580" y1="262" x2="770" y2="338"/>
    <line x1="580" y1="310" x2="770" y2="343"/>
    <line x1="580" y1="358" x2="770" y2="348"/>
    <line x1="580" y1="436" x2="770" y2="356"/>
    <line x1="580" y1="484" x2="770" y2="362"/>
    <line x1="580" y1="532" x2="770" y2="370"/>
    <line x1="580" y1="580" x2="770" y2="378"/>
  </g>
  <!-- «include» label on middle line -->
  <text x="692" y="322" text-anchor="middle" font-size="10" fill="#9C8E84" font-style="italic">«include»</text>

  <!-- actor associations: Owner -> gold -->
  <g stroke="#C8965A" stroke-width="1.2">
    <line x1="112" y1="220" x2="350" y2="118"/>
    <line x1="112" y1="220" x2="350" y2="166"/>
    <line x1="112" y1="222" x2="350" y2="214"/>
    <line x1="112" y1="225" x2="350" y2="262"/>
    <line x1="112" y1="228" x2="350" y2="310"/>
    <line x1="112" y1="230" x2="350" y2="358"/>
  </g>
  <!-- actor associations: Worker -> green -->
  <g stroke="#5E7E5E" stroke-width="1.2">
    <line x1="112" y1="500" x2="350" y2="436"/>
    <line x1="112" y1="500" x2="350" y2="484"/>
    <line x1="112" y1="502" x2="350" y2="532"/>
    <line x1="112" y1="504" x2="350" y2="580"/>
  </g>

  <!-- gold use cases (owner-only) -->
  <g font-size="12.5" fill="#2E2520" text-anchor="middle">
    <ellipse cx="465" cy="118" rx="115" ry="21" fill="#F5EFE6" stroke="#C8965A"/><text x="465" y="122">Manage users &amp; roles</text>
    <ellipse cx="465" cy="166" rx="115" ry="21" fill="#F5EFE6" stroke="#C8965A"/><text x="465" y="170">Manage materials</text>
    <ellipse cx="465" cy="214" rx="115" ry="21" fill="#F5EFE6" stroke="#C8965A"/><text x="465" y="218">Manage products &amp; BOM</text>
    <ellipse cx="465" cy="262" rx="115" ry="21" fill="#F5EFE6" stroke="#C8965A"/><text x="465" y="266">Configure overhead</text>
    <ellipse cx="465" cy="310" rx="115" ry="21" fill="#F5EFE6" stroke="#C8965A"/><text x="465" y="314">View unit cost (HPP)</text>
    <ellipse cx="465" cy="358" rx="115" ry="21" fill="#F5EFE6" stroke="#C8965A"/><text x="465" y="362">Record sales / orders</text>
  </g>
  <!-- green use cases (both roles) -->
  <g font-size="12.5" fill="#2E2520" text-anchor="middle">
    <ellipse cx="465" cy="436" rx="115" ry="21" fill="#EFF6EE" stroke="#7A9B7A"/><text x="465" y="440">Record stock movement</text>
    <ellipse cx="465" cy="484" rx="115" ry="21" fill="#EFF6EE" stroke="#7A9B7A"/><text x="465" y="488">Log production batch</text>
    <ellipse cx="465" cy="532" rx="115" ry="21" fill="#EFF6EE" stroke="#7A9B7A"/><text x="465" y="536">View materials / recipes</text>
    <ellipse cx="465" cy="580" rx="115" ry="21" fill="#EFF6EE" stroke="#7A9B7A"/><text x="465" y="584">Shopping list · Preferences</text>
  </g>

  <!-- Login use case (required by all) -->
  <ellipse cx="870" cy="345" rx="100" ry="40" fill="#FFFFFF" stroke="#3A5BA0" stroke-width="2"/>
  <text x="870" y="350" text-anchor="middle" font-size="17" font-weight="bold" fill="#2E2520">Login</text>

  <text x="505" y="676" text-anchor="middle" font-size="11" fill="#9C8E84">Gold = Owner-only · Green = both roles · dashed lines: every use case «includes» Login (authentication required)</text>
</svg>
